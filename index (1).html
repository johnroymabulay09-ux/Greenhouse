<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Advanced Greenhouse Control System</title>
<style>
:root{--bg:#07111f;--panel:#0f172a;--border:rgba(148,163,184,.18);--text:#e5e7eb;--muted:#94a3b8;--green:#4ade80;--blue:#38bdf8;--yellow:#facc15;--red:#fb7185}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(circle at top left,#0f2a1e,#07111f 45%);color:var(--text);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:rgba(2,6,23,.92);padding:24px 18px;border-right:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.logo-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--green),#16a34a)}
.logo h2{font-size:20px;color:var(--green)}
.sidebar a{display:flex;color:var(--muted);padding:13px 14px;border-radius:12px;text-decoration:none;transition:.25s;margin-bottom:6px}
.sidebar a:hover,.sidebar a.active{background:rgba(74,222,128,.10);color:var(--green)}
.main{flex:1;display:flex;flex-direction:column}
header{background:rgba(2,6,23,.75);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.time-pill{background:rgba(15,23,42,.9);border:1px solid var(--border);padding:10px 14px;border-radius:999px;color:var(--green);font-weight:600}
.dashboard{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:linear-gradient(180deg,rgba(17,24,39,.96),rgba(15,23,42,.96));padding:20px;border-radius:22px;border:1px solid var(--border)}
.card h3{color:var(--green);margin-bottom:10px}
.value{font-size:36px;font-weight:800}
.progress{height:9px;background:#1f2937;border-radius:20px;margin:14px 0 12px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,var(--green),var(--blue))}
input{width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#020617;color:white}
canvas{width:100%;height:100px;margin-top:12px;background:rgba(2,6,23,.35);border-radius:14px}
.controls button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:14px;background:#1e40af;color:white;font-weight:800;cursor:pointer}
.controls button.active{background:#16a34a}
.alert{position:fixed;top:24px;right:24px;background:linear-gradient(135deg,#ef4444,#be123c);padding:15px 22px;border-radius:14px;display:none;font-weight:800}
.footer{text-align:center;padding:14px;background:rgba(2,6,23,.85)}
@media(max-width:760px){.layout{flex-direction:column}.sidebar{width:100%}header{flex-direction:column;gap:10px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo"><div class="logo-icon"></div><h2>GreenSense</h2></div>
<a href="#" class="active">Overview</a>
<a href="#">Sensors</a>
<a href="#">Automation</a>
<a href="#">Logs</a>
</aside>
<main class="main">
<header>
<div><h2>Advanced Greenhouse Monitoring Platform</h2></div>
<div class="time-pill" id="time"></div>
</header>
<section class="dashboard">
<div class="card"><h3>Temperature</h3><div class="value" id="tempD">25°C</div><div class="progress"><div id="tempBar"></div></div><canvas id="tempChart"></canvas><input id="tempI" type="number" value="25" oninput="update('temp')"></div>
<div class="card"><h3>Humidity</h3><div class="value" id="humD">60%</div><div class="progress"><div id="humBar"></div></div><canvas id="humChart"></canvas><input id="humI" type="number" value="60" oninput="update('hum')"></div>
<div class="card"><h3>Soil Moisture</h3><div class="value" id="soilD">50%</div><div class="progress"><div id="soilBar"></div></div><canvas id="soilChart"></canvas><input id="soilI" type="number" value="50" oninput="update('soil')"></div>
<div class="card"><h3>Light</h3><div class="value" id="lightD">300 lx</div><div class="progress"><div id="lightBar"></div></div><canvas id="lightChart"></canvas><input id="lightI" type="number" value="300" oninput="update('light')"></div>
<div class="card controls"><h3>Automation</h3><button onclick="toggle(this)">Pump OFF</button><button onclick="toggle(this)">Fan OFF</button><button onclick="toggle(this)">Lights OFF</button></div>
<div class="card"><h3>AI Status</h3><div class="value" id="ai">Stable</div><p id="aiDesc">Monitoring conditions</p></div>
</section>
<div class="footer">GreenSense Interface v2.0</div>
</main>
</div>
<div class="alert" id="alertBox">Critical condition detected</div>
<script>
const histories={temp:[25],hum:[60],soil:[50],light:[300]};
function drawChart(id,data,max){const c=document.getElementById(id),ctx=c.getContext('2d');const w=c.offsetWidth,h=c.offsetHeight,r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;ctx.scale(r,r);ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.strokeStyle='#4ade80';ctx.lineWidth=2;data.forEach((v,i)=>{const x=data.length===1?0:i*(w/(data.length-1));const y=h-(v/max)*h;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();}
function update(type){const input=document.getElementById(type+'I');const v=Number(input.value)||0;const max=type==='light'?1000:100;document.getElementById(type+'D').textContent=v+(type==='temp'?'°C':type==='light'?' lx':'%');document.getElementById(type+'Bar').style.width=(type==='light'?v/10:v)+'%';histories[type].push(v);if(histories[type].length>20)histories[type].shift();drawChart(type+'Chart',histories[type],max);checkAI();}
function toggle(btn){btn.classList.toggle('active');btn.textContent=btn.textContent.includes('OFF')?btn.textContent.replace('OFF','ON'):btn.textContent.replace('ON','OFF')}
function checkAI(){const temp=Number(tempI.value),soil=Number(soilI.value);if(temp>45||soil<30){alertBox.style.display='block';ai.textContent='Intervention';aiDesc.textContent='Cooling or irrigation triggered'}else{alertBox.style.display='none';ai.textContent='Stable';aiDesc.textContent='Monitoring conditions'}}
setInterval(()=>time.textContent=new Date().toLocaleTimeString(),1000);
['temp','hum','soil','light'].forEach(update);
</script>
</body>
</html>
